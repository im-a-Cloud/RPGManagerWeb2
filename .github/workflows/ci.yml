name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quarkus:
    name: Build Quarkus (api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Dar permissão de execução ao mvnw
        working-directory: api
        run: chmod +x mvnw

      - name: Build com Maven wrapper
        working-directory: api
        run: ./mvnw package -DskipTests -B

  go:
    name: Build Go (services)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        working-directory: services
        run: go build -o /dev/null ./...

      - name: Test
        working-directory: services
        run: go test ./...